# Har kuni ertalab navbatdagi maqolani saytga, Telegram kanalga va (sozlangan bo'lsa) Facebook sahifaga joylaydi.
#
# Kerakli sozlamalar (GitHub → Settings → Secrets and variables → Actions):
#   secret   TELEGRAM_BOT_TOKEN  — @BotFather bergan token (bot kanalda admin bo'lishi kerak)
#   variable TELEGRAM_CHAT_ID    — kanal manzili, masalan @avazbek_tulovov
#   variable REVIEW_GROUP_ID     — ixtiyoriy, nazorat guruhi ID'si (kechqurun namuna, ertalab xabar)
#   variable FB_PAGE_ID          — ixtiyoriy, Facebook sahifa ID'si
#   secret   FB_PAGE_TOKEN       — ixtiyoriy, Facebook sahifa tokeni
name: Kunlik nashr

on:
  schedule:
    - cron: "0 4 * * *"      # 09:00 Toshkent vaqti (UTC+5): kanalga nashr. GitHub ba'zan 10–30 daqiqa kechiktiradi.
    - cron: "0 13 * * *"     # 18:00 Toshkent: ertangi postning namunasi nazorat guruhiga
  workflow_dispatch:
    inputs:
      slug:
        description: "Aynan shu maqolani hozir joylash — raqami (13) yoki papka nomi. Bo'sh qoldirilsa navbatdagisi."
        required: false
        default: ""
      dry_run:
        description: "Sinov: hech narsa yuborilmaydi, faqat log"
        type: boolean
        default: false
      check:
        description: "Faqat token va bot huquqlarini tekshirish (hech narsa yuborilmaydi)"
        type: boolean
        default: false
      review_next:
        description: "Ertangi post namunasini nazorat guruhiga hozir yuborish"
        type: boolean
        default: false
      preview_chat_id:
        description: "Namuna: postni kanalga emas, shu Telegram ID'ga yuborish (avval botga Start bosing)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: nashr
  cancel-in-progress: false

jobs:
  nashr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - name: Git sozlash
        run: |
          git config user.name "sayt-bot"
          git config user.email "sayt-bot@users.noreply.github.com"
      - name: Nashr qilish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FORCE_SLUG: ${{ inputs.slug }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          CHECK: ${{ inputs.check && '1' || '' }}
          PREVIEW_CHAT_ID: ${{ inputs.preview_chat_id }}
          REVIEW_GROUP_ID: ${{ vars.REVIEW_GROUP_ID }}
          REVIEW_NEXT: ${{ (inputs.review_next || github.event.schedule == '0 13 * * *') && '1' || '' }}
          PUSH: "1"
        run: python3 tools/publish.py
